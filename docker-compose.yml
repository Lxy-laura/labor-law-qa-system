version: "3.8"

# ============================================================
# 劳动合同纠纷智能问答系统 - Docker 编排文件
# ============================================================
# 包含服务：
#   1. postgres    - PostgreSQL 数据库（存储用户、法条、对话历史等）
#   2. milvus      - Milvus 向量数据库（存储法条向量）
#   3. etcd        - Milvus 依赖的键值存储
#   4. minio       - Milvus 依赖的对象存储
#   5. backend     - FastAPI 后端服务
#   6. frontend    - Nginx 前端服务（静态文件 + API 反代）
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 数据库
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: labor-law-postgres
    restart: always
    environment:
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: labor123
      POSTGRES_DB: labor_law
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor -d labor_law"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - labor-law-network

  # ----------------------------------------------------------
  # Milvus 依赖: etcd（键值存储）
  # ----------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: labor-law-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - labor-law-network

  # ----------------------------------------------------------
  # Milvus 依赖: MinIO（对象存储）
  # ----------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: labor-law-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"  # MinIO 控制台
      - "9000:9000"  # MinIO API
    volumes:
      - minio_data:/minio/data
    command: minio server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - labor-law-network

  # ----------------------------------------------------------
  # Milvus 向量数据库
  # ----------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: labor-law-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "19530:19530"  # Milvus gRPC
      - "9091:9091"    # Milvus 健康检查
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - labor-law-network

  # ----------------------------------------------------------
  # FastAPI 后端服务
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: labor-law-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://labor:labor123@postgres:5432/labor_law
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: legal_articles
      EMBEDDING_MODEL: BAAI/bge-large-zh-v1.5
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-me}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./scripts:/app/scripts
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - labor-law-network

  # ----------------------------------------------------------
  # Nginx 前端服务（静态文件 + API 反向代理）
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: labor-law-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - labor-law-network

# ============================================================
# 持久化数据卷
# ============================================================
volumes:
  postgres_data:
    driver: local
  milvus_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  huggingface_cache:
    driver: local

# ============================================================
# 内部网络
# ============================================================
networks:
  labor-law-network:
    driver: bridge
